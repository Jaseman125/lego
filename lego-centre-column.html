<p style="font-family: sans-serif; font-size: 56px; text-align: center; color: red; text-shadow: 2px 2px 4px black; margin-top: -10px; margin-bottom: 10px;">Chapter 1: Destination Moon</p>

<p style="font-family: sans-serif; font-size: 12px; text-align: left; color: yellow; text-shadow: 1px 1px 2px black; margin-top: -10px; margin-bottom: 20px;">In the spirit of exploration, Legoland had conceived of a mission to colonise the moon of Selene which orbited Planet Legoland.
<br><br>
Eagle was an AI, Robotics and Communications expert.  She had designed and built five 'Skaylor' Robots.  Eagle's robots would be issued to each of the crew members as their personal assistants.
<br><br>
Commander Condor named his assistant 'Atlas'.  His face was distinguished and he spoke with eloquence.  He had extensive leadership experience.  He was also a skilled geologist from a wealthy background.  His role would be to oversee the construction of five Moon Base outposts - each with specific purposes.  Atlas had been trained as a specialist in Moon Base construction - including life support systems, electrics and plumbing.
<br><br>
Falcon was a stocky, muscular man with a strong work-ethic and problem-solving mindset.  He was respectful and conscientious.  His new robotic rocket engineering assistant (Which he named 'Ace') would help him to construct 'Raptor' - the ship that would take them to Selene.  
<br><br>
Kestrel put her robot through his paces, testing his mechanical knowledge and abilities.  She named her robot 'Ratchet'.  As well as being a fine mechanic, Ratchet was also a competent pilot and driver - as was Kes herself.  She had a playful personality - bold, confident and sassy.
<br><br>
Hawk was a man of few words - reclusive, quiet and inwardly thoughtful.  He had a scientific background and was an inventor.  He was very anti-establishment, however he was too useful to be disregarded.  His robot 'Guardian' would serve as the crew's medic as well as assisting Hawk in the manufacture of any specialist equipment that they might find they need during the mission.
<br><br>
The 5 astronauts made their farewells and boarded Raptor - a magnificent looking craft that sat majestically on the Ground Control launch pad.  All of them felt anxious and fearful.  The robots were already on board.
<br><br>
Kes would be piloting the ship with Ratchet as co-pilot, whilst Falcon and Ace monitored the engines and other on-board systems.  Atlas would be the navigator whilst Commander Condor supervised all of the crew and robots.  Guardian was monitoring the heart rates and general health of the crew.
<br><br>
Hawk seemed a little lost.  He wouldn't really have any important role until they reached Selene.  He watched the exterior cameras as the people of Legoland waited excitedly to witness the momentous launch.
<br><br>
After all the pre-flight checks were completed, the engines fired up with a roar.  They all strapped in and within seconds they were hurtling into the clear blue Legoland sky.  Once Raptor had passed through Legoland's atmosphere the ride got smoother.  Condor gave permission for the crew to unfasten their seat belts.
<br><br>
Although each of them had spent time with their robot companions, the crew members were actually meeting each other for the first time.  This was how it was on Legoland - things tended to happen spontaneously with plans put into play impulsively.  This was a good opportunity for them to get to know each other - sharing some of their background achievements and experiences.  Each of them was trying to get a clearer understanding of one another's personalities and quirks. They were all enjoying the interaction and the robots were also adding to the conversation, in-between focusing on the flight.
<br><br>
Suddenly an alarm sound interrupted their chat.  'What's that?' Condor asked quickly.  Falcon turned his eyes to his computer console to find the answer.  The fuel reserve for the main engines was almost entirely depleted. Falcon didn't want to accept the reading.  He felt ashamed to announce the news to the others.
<br><br>
'WHAT?!' shouted Condor, suddenly switching his demeanour.  'How is this possible?!'
<br><br>
'I must have miscalculated the fuel consumption... or perhaps there were some unforeseen forces upon the ship and the engines had compensated for it by increasing the intake.'
<br><br>
Falcon was hoping his second explanation would shift some of the blame off him and redirect it toward an unknown anomaly.
<br><br>
'Why didn't you notice this?' Eagle asked Ace.  She was feeling partially responsible as it was her that had created the Skaylor robots and they should not have missed such an important detail.
<br><br>
'I have no explanation for it' answered Ace. 'I am conducting further examinations' she continued.
<br><br>
Kestrel's mind was now racing.  She needed to formulate a strategy for landing the ship without fuel.  'We can use the retro rockets to help soften the landing' she said in an attempt to offer the others a glimmer of hope.
<br><br>
Falcon knew this wouldn't be enough.  'We're going to crash.' he said bluntly.</p>

`
<p style="font-family: sans-serif; font-size: 56px; text-align: center; color: red; text-shadow: 2px 2px 4px black; margin-top: -10px; margin-bottom: 20px;">Chapter 2: The Crash</p>

<p style="font-family: sans-serif; font-size: 12px; text-align: left; color: yellow; text-shadow: 1px 1px 2px black; margin-top: -10px; margin-bottom: 10px;">Raptor was now fast approaching Selene as it grew larger on their display screens.  They could no longer make out the horizon.
<br><br>
Kestrel decided that she would attempt a circling manoeuvre in an effort to slow down the approach.  She was able to pull the ship hard to the right.  The G-forces from this move made it difficult for any of them to function.
<br><br>
'We are veering from the target destination for the Command Centre' reported Atlas calmly.
<br><br>
'Kes - What are you doing?' asked Connor.
<br><br>
She didn't have time to explain.  Nobody bothered to respond to Atlas's observation.  They were now entirely focused on trying to survive the imminent crash landing.
<br><br>
Kestrel's intervention was partially successful - The descent speed had decreased, however they had now gone into a full uncontrollable spin.
<br><br>
At this point all of the human crew members had entered a state of frozen horror.  Only the robots were able to continue operating rationally.
<br><br>
Ratchet took over the flight controls activating the retro-rockets.  Atlas continued monitoring their location and trajectory.
<br><br>
Guardian was attempting to calm the human crew members down. 'Almost there now' he said 'Ratchet has taken over control of the ship' he continued, trying to reassure them.
<br><br>
Echo was busy diverting the ships systems to prioritize those which would assist the landing.
<br><br>
Suddenly the ship impacted onto the solid ice lake surface sending huge fractures and cracks through the shuddering ice and sending debris flying in all directions.
The human crew members were instantly knocked unconscious.  Parts of the ship collapsed and panels broke off - splintering to the floor of Raptor's interior.  Several fires erupted.
<br><br>
One of Condor's legs was caught in the flames.  The pain brought him around and he started screaming in pain.  Guardian quickly attended to him using a fire extinguisher to deal with the blaze and then dressing his burns.
<br><br>
Kestrel, Falcon, Eagle and Hawk were also regaining consciousness.
<br><br>
A huge split in the hull of the ship had exposed them to the outer atmosphere of Selene.  Ice-cold winds were now sweeping in.  All of them had kept their spacesuits and helmets on during the flight as per regulations.
They were all alive... for now.
<br><br>
The crew were still dazed but were now starting to assess their predicament.  Things were very different here to the life they were accustomed to on Legoland.  They were far from the landing site that had been planned as the location for their primary base - 'Command Centre'.
<br><br>
'What a mess!' thought Condor, trying to take his mind from the constant pain from his burned leg.  But each of them had done the best they could given the situation.  The Skaylor robots had proven themselves invaluable.  Without their interventions they would all surely have perished.</p>

`
<p style="font-family: sans-serif; font-size: 56px; text-align: center; color: red; text-shadow: 2px 2px 4px black; margin-top: -10px; margin-bottom: 10px;">Chapter 3:  The Atomic Converter</p>

<p style="font-family: sans-serif; font-size: 12px; text-align: left; color: yellow; text-shadow: 1px 1px 2px black; margin-top: -10px; margin-bottom: 10px;">Echo and Ace carried Condor out of the wreckage to join the others who were already standing on the ice - observing for the first time what remained of Falcon's ship.
<br><br>
Atlas once again reminded them that the mission had strayed very far off course and this stirred Condor to clear his head and take charge again.  Thinking aloud he said 'We will need to construct rovers in order to reach the Command Centre site'.
<br><br>
Kestrel was glad to see that he still had the drive to continue with the mission. 'I used to build Dune Bug's for fun when I was younger.' she replied.
<br><br>
'Could you build some - repurposing materials from the ship?' he asked.
<br><br>
'I could' she said.  'Most of what we would need is here.  However we don't have any rubber tyres.' she continued.  She thought this might be a show-stopper but then Hawk broke his silence.
<br><br>
'This my friends... is where I come in.' he said.  Hawk was carrying a strange device which resembled what could have been a large camera or even some sort of gun.  It had a sight fitted on one side and a number of unmarked buttons and dials.  Attached to the device was a hose which dangled down to the ground with a nozzle at the end.  It was like a camera which doubled as a vacuum cleaner.
<br><br>
Everyone stared at him looking both surprised and confused.  The device looked almost comical.
<br><br>
'May I present to you - The Atomic Converter' Hawk continued.
<br><br>
'Say what?' said Kestrel looking very doubtful.  They were all intrigued.
<br><br>
'This device.... believe it or not - collects small stones, dirt and dust from the ground and then breaks them down into compressed sub-atomic particles.  It then fires a particle beam from here' he explained, pointing to the front end of the device.  The particles and atoms are rearranged, creating completely new materials or components which can then be assembled in the form of equipment, building blocks or even...' he paused tuning the dials and pressing buttons on the device - 'Rubber tyres!'.  He held the device steadily, aiming it at the ice and pressing a trigger.  The particle beam was like a shaft of light shining onto the ice.  As he continued to press the trigger - a rubber tyre was materialising before them on the ground.  They noticed that a perfectly spherical hole in the ice had appeared directly below where the nozzle was dangling.  'It seems to work with ice as well' he added - seeming surprised himself by this.
<br><br>
The others stood open-mouthed and thoughts started running through their minds - questioning the potential uses for such a powerful device.  'Why had none of them ever heard of it until now?'.  It seemed like an absolute game-changer.  And it was.
<br><br>
Even Condor was unaware of the Atomic Converter.  He had only been given a brief overview of the mission and almost no information about his crew mates.  All he knew was that he would be teaming up with a small group of outstanding individuals - each with their own unique skills.  'Okay!... Well then... let's get to work!' he said - modestly playing down what he had just witnessed.
<br><br>
Condor's words set the team in motion.  He was unable to help out with any of the physical work himself and Guardian stayed with him, whilst the other four humans and robots got to work on building four Dune Bug's and another Buggy with trailers attached to the back.  Kestrel, Eagle, Falcon and Hawk would drive the Dune Bug's and Ratchet would drive the other Buggy.  Condor, Atlas, Echo, Ace and Guardian would sit in the trailers for the journey across the ice.
<br><br>
The pace of their combined teamwork was incredible.  The Skaylors never suffered from fatigue.  They were powered by internal nuclear reactors and did not require any recharge or rest periods.  They could work around the clock, always remaining focused on their given duties.
<br><br>
The rovers were ready - Four Dune Bug's and the other Buggy with the five trailers hitched to the back.  Hawk had made all of the tyres using the Atomic Converter.  It was cold and unpleasant at their present location, so they wasted no time in setting off in the direction of the Command Centre site.</p>
