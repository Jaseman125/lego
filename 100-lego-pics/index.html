<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>100 LEGO Pics</title>

<style>
    body {
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #6cf;
        margin-bottom: 20px;
    }

    /* 10×10 grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 10px;
        justify-items: center;
    }

    .grid img {
        height: 90px;          /* All images same height */
        width: auto;           /* Width adjusts proportionally */
        object-fit: contain;   /* No cropping */
        border-radius: 4px;
        cursor: pointer;
        background: #222;
        padding: 4px;
    }
</style>

</head>
<body>

<h1>100 LEGO Pics</h1>

<div class="grid" id="picGrid"></div>

<script>
const apiURL = "https://api.github.com/repos/Jaseman125/lego/contents/100-lego-pics";

fetch(apiURL)
    .then(response => response.json())
    .then(items => {

        // Allowed image types
        const allowed = [".jpg", ".jpeg", ".png", ".bmp"];

        // Filter only images
        const images = items.filter(file => {
            const name = file.name.toLowerCase();
            return allowed.some(ext => name.endsWith(ext));
        });

        // Sort alphabetically for deterministic order
        images.sort((a, b) => a.name.localeCompare(b.name));

        const grid = document.getElementById("picGrid");

        images.forEach(img => {
            const link = document.createElement("a");
            link.href = img.download_url;
            link.target = "_blank";

            const image = document.createElement("img");
            image.src = img.download_url;
            image.alt = img.name;

            link.appendChild(image);
            grid.appendChild(link);
        });

    })
    .catch(err => {
        document.getElementById("picGrid").innerHTML = "<p>Error loading images.</p>";
        console.error(err);
    });
</script>

</body>
</html>
